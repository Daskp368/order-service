<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1215" viewBox="0 0 1000 1215" role="img" aria-labelledby="title description">
  <title id="title">Путь защищённого JWT-запроса</title>
  <desc id="description">Схема от HTTP-запроса с Bearer JWT до передачи запроса контроллеру.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head"/>
    </marker>
    <style>
      .node { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
      .arrow { stroke: #7c3aed; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .arrow-head { fill: #7c3aed; }
      .label { fill: #1f2937; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 18px; text-anchor: middle; }
      .title { font-weight: 600; }
      .detail { font-weight: 400; }
      @media (prefers-color-scheme: dark) {
        .node { fill: #241b35; stroke: #a78bfa; }
        .arrow { stroke: #a78bfa; }
        .arrow-head { fill: #a78bfa; }
        .label { fill: #f3f4f6; }
      }
    </style>
  </defs>

  <path class="arrow" d="M 500 94 L 500 116"/>
  <path class="arrow" d="M 500 194 L 500 216"/>
  <path class="arrow" d="M 500 294 L 500 316"/>
  <path class="arrow" d="M 500 394 L 500 416"/>
  <path class="arrow" d="M 500 494 L 500 516"/>
  <path class="arrow" d="M 500 594 L 500 616"/>
  <path class="arrow" d="M 500 694 L 500 716"/>
  <path class="arrow" d="M 500 794 L 500 816"/>
  <path class="arrow" d="M 500 894 L 500 916"/>
  <path class="arrow" d="M 500 994 L 500 1016"/>
  <path class="arrow" d="M 500 1094 L 500 1116"/>

  <g>
    <rect class="node" x="90" y="20" width="820" height="74" rx="12"/>
    <text class="label" x="500" y="48"><tspan class="title" x="500">HTTP-запрос</tspan><tspan class="detail" x="500" dy="25">Authorization: Bearer &lt;JWT&gt;</tspan></text>
  </g>
  <g>
    <rect class="node" x="90" y="120" width="820" height="74" rx="12"/>
    <text class="label" x="500" y="148"><tspan class="title" x="500">SecurityFilterChain</tspan><tspan class="detail" x="500" dy="25">выбирает цепочку фильтров</tspan></text>
  </g>
  <g>
    <rect class="node" x="90" y="220" width="820" height="74" rx="12"/>
    <text class="label" x="500" y="248"><tspan class="title" x="500">JwtAuthenticationFilter</tspan><tspan class="detail" x="500" dy="25">извлекает JWT как String</tspan></text>
  </g>
  <g>
    <rect class="node" x="90" y="320" width="820" height="74" rx="12"/>
    <text class="label" x="500" y="348"><tspan class="title" x="500">JwtService.extractUsername()</tspan><tspan class="detail" x="500" dy="25">проверяет подпись, алгоритм и срок JWT</tspan></text>
  </g>
  <g>
    <rect class="node" x="90" y="420" width="820" height="74" rx="12"/>
    <text class="label title" x="500" y="463">Из claim sub извлекается username</text>
  </g>
  <g>
    <rect class="node" x="90" y="520" width="820" height="74" rx="12"/>
    <text class="label" x="500" y="548"><tspan class="title" x="500">DatabaseUserDetailsService</tspan><tspan class="detail" x="500" dy="25">загружает пользователя из БД</tspan></text>
  </g>
  <g>
    <rect class="node" x="90" y="620" width="820" height="74" rx="12"/>
    <text class="label" x="500" y="648"><tspan class="title" x="500">Создаётся UserDetails</tspan><tspan class="detail" x="500" dy="25">username, BCrypt-хеш, ROLE_USER</tspan></text>
  </g>
  <g>
    <rect class="node" x="90" y="720" width="820" height="74" rx="12"/>
    <text class="label" x="500" y="748"><tspan class="title" x="500">Создаётся Authentication</tspan><tspan class="detail" x="500" dy="25">UsernamePasswordAuthenticationToken</tspan></text>
  </g>
  <g>
    <rect class="node" x="90" y="820" width="820" height="74" rx="12"/>
    <text class="label" x="500" y="848"><tspan class="title" x="500">Создаётся SecurityContext</tspan><tspan class="detail" x="500" dy="25">в него помещается Authentication</tspan></text>
  </g>
  <g>
    <rect class="node" x="90" y="920" width="820" height="74" rx="12"/>
    <text class="label" x="500" y="948"><tspan class="title" x="500">SecurityContextHolder</tspan><tspan class="detail" x="500" dy="25">сохраняет SecurityContext</tspan></text>
  </g>
  <g>
    <rect class="node" x="90" y="1020" width="820" height="74" rx="12"/>
    <text class="label" x="500" y="1048"><tspan class="title" x="500">Spring Security проверяет</tspan><tspan class="detail" x="500" dy="25">anyRequest().authenticated()</tspan></text>
  </g>
  <g>
    <rect class="node" x="90" y="1120" width="820" height="74" rx="12"/>
    <text class="label title" x="500" y="1163">Запрос передаётся контроллеру</text>
  </g>
</svg>
